<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List of Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row mb-3">
        <div class="col-md-6">
            <h2>List of Clients</h2>
        </div>
        <div class="col-md-6 text-end">
            <a th:href="@{/clients/add}" class="btn btn-primary">Add Client</a>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Age</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="client : ${clients}">
                <td th:text="${client.id}">1</td>
                <td th:text="${client.name}">Name</td>
                <td th:text="${client.email}">email@example.com</td>
                <td th:text="${client.phone}">1234567890</td>
                <td th:text="${client.address}">City, Country</td>
                <td th:text="${client.age}">21</td>
                <td th:text="${client.salary}">45000</td>
                <td>
                    <a th:href="@{'/clients/edit/' + ${client.id}}" class="btn btn-sm btn-primary">Edit</a>
                    <a th:href="@{'/clients/delete/' + ${client.id}}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this client?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
