<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Edit Client</h2>
    <form th:action="@{'/clients/edit/' + ${client.id}}" th:object="${client}" method="post" class="row g-3">
        <div class="col-md-6">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control" />
        </div>
        <div class="col-md-6">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" />
        </div>
        <div class="col-md-6">
            <label>Phone</label>
            <input type="text" th:field="*{phone}" class="form-control" />
        </div>
        <div class="col-md-6">
            <label>Address</label>
            <input type="text" th:field="*{address}" class="form-control" />
        </div>
        <div class="col-md-6">
            <label>Age</label>
            <input type="number" th:field="*{age}" class="form-control" />
        </div>
        <div class="col-md-6">
            <label>Salary</label>
            <input type="number" step="0.01" th:field="*{salary}" class="form-control" />
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Update</button>
            <a th:href="@{/clients}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
