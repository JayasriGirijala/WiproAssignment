<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTO Vehicle Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-4 mb-5">
  <h2 class="text-center mb-4">RTO Vehicle Registration Form</h2>
  <div class="progress mb-4">
    <div id="formProgress" class="progress-bar" role="progressbar" style="width: 0%;">0%</div>
  </div>
  <form id="rtoForm">
    <h4>1 Owner Details</h4>
    <div class="row g-3">
      <div class="col-md-6">
        <label>Full Name</label>
        <input type="text" class="form-control" placeholder="e.g. Priya Natarajan" required>
      </div>
      <div class="col-md-6">
        <label>Date of Birth</label>
        <input type="date" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label>Email</label>
        <input type="email" class="form-control" placeholder="name@example.com" required>
      </div>
      <div class="col-md-6">
        <label>PAN</label>
        <input type="text" class="form-control" placeholder="ABCDE1234F" pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" required>
      </div>
      <div class="col-md-6">
        <label>Mobile (India)</label>
        <input type="tel" class="form-control" placeholder="+91 98XXXXXXXX" pattern="^[6-9]\d{9}$" required>
      </div>
      <div class="col-md-6">
        <label>Driving License No.</label>
        <input type="text" class="form-control" placeholder="Format: State(2) + RTO(2) + 11 digits" required>
      </div>
      <div class="col-md-6">
        <label>PAN (Alternate Format)</label>
        <input type="text" class="form-control" placeholder="1334 5679.9012">
      </div>
    </div>
    <h4 class="mt-4">2 Address</h4>
    <div class="row g-3">
      <div class="col-md-6">
        <label>Address Line 1</label>
        <input type="text" class="form-control" placeholder="e.g. TN10 AB 12" required>
      </div>
      <div class="col-md-6">
        <label>Vehicle Class</label>
        <select class="form-select" required>
          <option value="">Choose...</option>
          <option>MCWG</option>
          <option>LMV</option>
          <option>HMV</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Fuel Type</label>
        <select class="form-select" required>
          <option value="">Choose...</option>
          <option>Petrol</option>
          <option>Diesel</option>
          <option>Electric</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Make</label>
        <input type="text" class="form-control" placeholder="e.g. Maruti Suzuki" required>
      </div>
      <div class="col-md-6">
        <label>Engine No.</label>
        <input type="text" class="form-control" placeholder="Alphanumeric, 6-12" required>
      </div>
      <div class="col-md-6">
        <label>Year of Manufacture</label>
        <input type="number" class="form-control" value="2024" required>
      </div>
      <div class="col-md-6">
        <label>Purchase Date</label>
        <input type="date" class="form-control" required>
      </div>
    </div>
    <h4 class="mt-4">3 Compliance & Insurance</h4>
    <div class="row g-3">
      <div class="col-md-6">
        <label>Emission Norm</label>
        <select class="form-select" required>
          <option value="">Choose...</option>
          <option>BS4</option>
          <option>BS6</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Insurance Policy No.</label>
        <input type="text" class="form-control" placeholder="e.g. ICICI-ABC01234" required>
      </div>
      <div class="col-md-6">
        <label>Insurer</label>
        <input type="text" class="form-control" placeholder="e.g. New India Assurance" required>
      </div>
      <div class="col-md-6">
        <label>Insurance Expiry</label>
        <input type="date" class="form-control" required>
      </div>
    </div>
    <h4 class="mt-4">5 Finance (Hypothecation)</h4>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="hypothecationSwitch">
      <label class="form-check-label" for="hypothecationSwitch">Vehicle is under hypothecation / loan</label>
    </div>
    <h4 class="mt-4">6 Uploads</h4>
    <div class="mb-3">
      <input type="file" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary mt-3">Submit</button>
  </form>
</div>
<script src="jstask10.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
