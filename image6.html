<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #fff;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .gallery figure {
      margin: 0;
      text-align: center;
    }

    .gallery img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .notes {
      margin-top: 30px;
    }

    .submit-section {
      margin-top: 40px;
      border-top: 1px solid #ccc;
      padding-top: 20px;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>Responsive Image Gallery</h2>

  <div class="gallery">

    <figure>
      <img src="https://images.unsplash.com/photo-1627803231212-37314f28ca98?auto=format&fit=crop&w=400&q=80" alt="Basmati rice bag">
      <figcaption>Basmati rice — 5 kg bag.</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1604908812849-9c37f8db7007?auto=format&fit=crop&w=400&q=80" alt="Assorted Snacks Box">
      <figcaption>Assorted Snacks Box<br><small>(WebP served when supported).</small></figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1613721082764-f7293f1e1212?auto=format&fit=crop&w=400&q=80" alt="Delivery Truck">
      <figcaption>Delivery truck (SVG inline with accessible title/desc).</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=400&q=80" alt="" aria-hidden="true">
      <figcaption>Decorative divider<br><small>(not read by screen readers).</small></figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1588854337236-6885c79f3c0e?auto=format&fit=crop&w=400&q=80" alt="Store Map" usemap="#aislemap">
      <figcaption>Click a section to navigate to that aisle (image map)</figcaption>
    </figure>

  </div>

  <div class="notes">
    <h3>Notes</h3>
    <ul>
      <li>Use <code>srcset</code> and <code>&lt;picture&gt;</code> to reduce bandwidth and serve modern formats.</li>
      <li>Add <code>loading="lazy"</code> to defer-screen images.</li>
    </ul>
  </div>

  <div class="submit-section">
    <h3>Submit Lab</h3>
    <button>Submit Lab</button>
  </div>

</body>
</html>
